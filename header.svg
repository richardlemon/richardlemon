<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Richard Lemon - web developer and creative strategist, Maastricht">
  <style>
    :root { --bg:#f4efe6; --ink:#141414; --muted:#6b645a; --vinyl:#151515; --groove:#2a2a2a; --lemon:#f2d22e; --rule:#d9d0c1; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --ink:#f0ece4; --muted:#8b949e; --vinyl:#050505; --groove:#1d1d1d; --lemon:#f2d22e; --rule:#30363d; }
    }
    .bg { fill: var(--bg); }
    .ink { fill: var(--ink); }
    .muted { fill: var(--muted); }
    .vinyl { fill: var(--vinyl); }
    .rim { stroke: var(--rule); stroke-width: 1.5; }
    .groove { fill: none; stroke: var(--groove); stroke-width: 1.2; }
    .lemon { fill: var(--lemon); }
    .rule { stroke: var(--rule); stroke-width: 1; }
    .arm { stroke: var(--muted); stroke-width: 6; stroke-linecap: round; fill: none; }
    .sans { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .spin { transform-origin: 250px 190px; animation: spin 1.8s linear infinite; }
    .shine { transform-origin: 250px 190px; }
    .fade { animation: fade .9s ease-out both; }
    .d1 { animation-delay: .2s; } .d2 { animation-delay: .5s; } .d3 { animation-delay: .8s; } .d4 { animation-delay: 1.1s; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .spin, .cursor { animation: none; }
      .fade { animation: none; }
    }
  </style>

  <rect class="bg" width="1200" height="380" rx="18"/>

  <!-- the record -->
  <g class="spin">
    <circle class="vinyl rim" cx="250" cy="190" r="150"/>
    <circle class="groove" cx="250" cy="190" r="140"/>
    <circle class="groove" cx="250" cy="190" r="131"/>
    <circle class="groove" cx="250" cy="190" r="123"/>
    <circle class="groove" cx="250" cy="190" r="114"/>
    <circle class="groove" cx="250" cy="190" r="104"/>
    <circle class="groove" cx="250" cy="190" r="96"/>
    <circle class="groove" cx="250" cy="190" r="87"/>
    <circle class="groove" cx="250" cy="190" r="79"/>
    <circle class="groove" cx="250" cy="190" r="70"/>
    <circle class="lemon" cx="250" cy="190" r="56"/>
    <text class="sans" x="250" y="178" text-anchor="middle" font-size="22" font-weight="800" fill="#141414" letter-spacing="1">RL</text>
    <text class="mono" x="250" y="200" text-anchor="middle" font-size="9" fill="#141414" letter-spacing="2">SIDE A</text>
    <text class="mono" x="250" y="216" text-anchor="middle" font-size="8" fill="#141414" letter-spacing="1.5">33 1/3 RPM</text>
    <circle cx="250" cy="190" r="4" fill="var(--bg)"/>
  </g>
  <!-- static sheen so the spin reads -->
  <path d="M 250 40 A 150 150 0 0 1 380 115 L 250 190 Z" fill="#ffffff" opacity="0.05"/>

  <!-- tonearm -->
  <circle cx="420" cy="58" r="12" class="muted"/>
  <path class="arm" d="M 420 58 L 412 170 L 368 222"/>
  <rect x="356" y="214" width="22" height="14" rx="3" transform="rotate(40 367 221)" class="muted"/>

  <!-- type -->
  <line class="rule" x1="490" y1="70" x2="1140" y2="70"/>
  <text class="mono muted fade d1" x="490" y="56" font-size="14" letter-spacing="3">NOW SPINNING / MAASTRICHT, NL</text>

  <text class="sans ink fade d2" x="486" y="160" font-size="84" font-weight="900" letter-spacing="-3">RICHARD</text>
  <text class="sans ink fade d2" x="486" y="240" font-size="84" font-weight="900" letter-spacing="-3">LEMON<tspan class="lemon">.</tspan></text>

  <text class="mono muted fade d3" x="490" y="286" font-size="17">web developer + creative strategist @ Ideebv</text>
  <text class="mono ink fade d4" x="490" y="316" font-size="17">&gt; from digging crates to shipping code<tspan class="cursor">_</tspan></text>

  <line class="rule" x1="490" y1="340" x2="1140" y2="340"/>
</svg>
